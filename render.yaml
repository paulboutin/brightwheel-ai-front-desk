# Service is assigned to the dedicated Brightwheel AI Front Desk / Prototype
# project environment in Render. No shared backend or environment variables.
services:
  - type: web
    name: brightwheel-ai-front-desk
    runtime: static
    repo: https://github.com/paulboutin/brightwheel-ai-front-desk
    branch: main
    buildCommand: npm ci && npm run check
    staticPublishPath: ./dist
    autoDeployTrigger: "off" # Public URL deployment; enable after GitHub connection is authorized.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
